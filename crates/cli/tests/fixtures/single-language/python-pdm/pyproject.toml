[project]
name = "example-pdm-app"
version = "0.1.0"
description = "Example Python PDM application"
authors = [
    {name = "Your Name", email = "you@example.com"},
]
dependencies = [
    "flask>=3.0.0",
    "requests>=2.31.0",
]
requires-python = ">=3.9"

[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
dev = [
    "pytest>=7.4.3",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
