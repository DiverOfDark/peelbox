[package]
name = "peelbox-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "peelbox"
path = "src/main.rs"

[dependencies]
peelbox-core = { path = "../core" }
peelbox-pipeline = { path = "../pipeline" }
peelbox-buildkit = { path = "../buildkit" }

clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.11", features = ["v4", "fast-rng"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.24"
serial_test = "3.4"
reqwest = { version = "0.12.25", features = ["json", "blocking"] }
bollard = "0.20"
futures-util = "0.3"
tar = "0.4"
flate2 = "1.0"
pretty_assertions = "1.4"
libtest-mimic = "0.8.1"

[[test]]
name = "static_e2e"
harness = false

[[test]]
name = "container_e2e"
harness = false
