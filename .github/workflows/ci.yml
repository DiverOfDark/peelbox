name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
      id-token: write
    steps:
      - name: Free Disk Space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            .buildkit-cache.tar.zst
          key: ${{ runner.os }}-cargo-ci-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-${{ github.ref_name }}-${{ github.sha }}
            ${{ runner.os }}-cargo-ci-${{ github.ref_name }}-
            ${{ runner.os }}-cargo-ci-

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov

      - name: Start BuildKit daemon
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d \
            --name buildkitd \
            --privileged \
            -p 127.0.0.1:1234:1234 \
            moby/buildkit:v0.20.2 \
            --addr tcp://0.0.0.0:1234
          timeout 30 sh -c 'until docker exec buildkitd buildctl --addr tcp://0.0.0.0:1234 debug workers >/dev/null 2>&1; do sleep 1; done'
          echo "BuildKit daemon is ready"

      - name: Fetch external compat fixtures
        if: matrix.os == 'ubuntu-latest' && github.ref != 'refs/heads/master'
        run: ./scripts/fetch-compat-fixtures.sh


      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Clean coverage data
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov clean --workspace

      - name: Run tests (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export PEELBOX_TEST_CACHE_DIR=/tmp/.test-cache
          export PEELBOX_BUILDKIT_ADDR=tcp://127.0.0.1:1234
          cargo llvm-cov nextest --no-default-features --profile ci --no-report --verbose --no-fail-fast

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest' && (success() || failure())
        run: |
          cargo llvm-cov report --cobertura --output-path cobertura.xml

      - name: Upload to Codecov coverage
        if: matrix.os == 'ubuntu-latest' && (success() || failure())
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: false
          files: cobertura.xml
          use_oidc: true

      - name: Upload to Codecov tests
        if: matrix.os == 'ubuntu-latest' && (success() || failure())
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: false
          report_type: test_results
          files: junit.xml
          use_oidc: true

      - name: Publish Test Report
        if: matrix.os == 'ubuntu-latest' && (success() || failure())
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "target/nextest/ci/junit.xml"

      - name: Build release binary
        run: |
          # Clean build for release binary (to avoid using instrumented artifacts)
          cargo build --release --no-default-features --verbose

      - name: Upload release binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: peelbox-ubuntu-latest
          path: target/release/peelbox
          retention-days: 1

      - name: Upload release binary (Cross-Platform)
        if: matrix.os != 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: peelbox-${{ matrix.os }}
          path: |
            target/release/peelbox
            target/release/peelbox.exe
          retention-days: 1
          if-no-files-found: ignore

      - name: Stop BuildKit daemon
        if: matrix.os == 'ubuntu-latest' && always()
        run: docker stop buildkitd && docker rm buildkitd || true

      - name: Create BuildKit cache archive
        if: matrix.os == 'ubuntu-latest' && always()
        run: |
          if [ -d /tmp/.test-cache/buildkit ]; then
            sudo tar -cf .buildkit-cache.tar.zst --zstd -C /tmp/.test-cache/buildkit . || true
            sudo chown $USER:$USER .buildkit-cache.tar.zst || true
          fi

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download release binary
        uses: actions/download-artifact@v7
        with:
          name: peelbox-ubuntu-latest
          path: target/release/

      - name: Make peelbox executable
        run: chmod +x target/release/peelbox

      - name: Start BuildKit daemon container
        run: |
          docker run -d \
            --name buildkitd \
            --privileged \
            -p 1234:1234 \
            moby/buildkit:latest \
            --addr tcp://0.0.0.0:1234

          # Wait for BuildKit to be ready
          timeout 30 sh -c 'until docker exec buildkitd buildctl --addr tcp://0.0.0.0:1234 debug workers >/dev/null 2>&1; do sleep 1; done'

          echo "BuildKit daemon is ready"
          docker exec buildkitd buildctl --addr tcp://0.0.0.0:1234 debug workers

      - name: Show Docker and BuildKit info
        run: |
          echo "=== Docker Version ==="
          docker version
          echo ""
          echo "=== Docker Info ==="
          docker info
          echo ""
          echo "=== BuildKit Container Status ==="
          docker ps -a --filter name=buildkitd

      - name: Build image with peelbox
        run: |
          ./target/release/peelbox build \
            --spec universalbuild.json \
            --tag peelbox:latest \
            --context . \
            --buildkit tcp://127.0.0.1:1234 

      - name: Test the built image
        run: |
          docker run --rm peelbox:latest --version
          docker run --rm peelbox:latest --help

      - name: Show BuildKit logs on failure
        if: failure()
        run: |
          echo "=== BuildKit daemon logs ==="
          docker logs buildkitd || true

      - name: Stop BuildKit daemon
        if: always()
        run: docker stop buildkitd && docker rm buildkitd

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          docker tag peelbox:latest ghcr.io/${REPO_OWNER}/peelbox:latest
          docker tag peelbox:latest ghcr.io/${REPO_OWNER}/peelbox:${{ github.sha }}
          docker tag peelbox:latest ghcr.io/${REPO_OWNER}/peelbox:${TIMESTAMP}

          docker push ghcr.io/${REPO_OWNER}/peelbox:latest
          docker push ghcr.io/${REPO_OWNER}/peelbox:${{ github.sha }}
          docker push ghcr.io/${REPO_OWNER}/peelbox:${TIMESTAMP}

          # Push version tag if triggered by tag
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker tag peelbox:latest ghcr.io/${REPO_OWNER}/peelbox:${VERSION}
            docker push ghcr.io/${REPO_OWNER}/peelbox:${VERSION}
          fi

  publish-github-releases:
    name: Publish Binaries to GitHub Releases
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7

      - name: Prepare Assets
        run: |
          mkdir -p assets
          cp peelbox-ubuntu-latest/peelbox assets/peelbox-linux-amd64
          cp peelbox-macos-latest/peelbox assets/peelbox-macos-universal
          cp peelbox-windows-latest/peelbox.exe assets/peelbox-windows-amd64.exe
          cd assets
          sha256sum * > checksums.txt

      - name: Publish Latest Build (Rolling)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          name: "Latest Build (master)"
          tag_name: latest
          files: |
            assets/peelbox-linux-amd64
            assets/peelbox-macos-universal
            assets/peelbox-windows-amd64.exe
            assets/checksums.txt
          body: "Automated build from master branch. Last updated on ${{ github.event.head_commit.timestamp }}."
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Versioned Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/peelbox-linux-amd64
            assets/peelbox-macos-universal
            assets/peelbox-windows-amd64.exe
            assets/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
