[profile.default]
slow-timeout = { period = "100s", terminate-after = 15 }

[profile.ci]
# CI slow-timeout: 300s × 5 = 1500s max (matches old default profile behavior)
# GitHub runners (2-core, 7GB RAM) are slower under parallel load
slow-timeout = { period = "300s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

[test-groups]
serial-tests = { max-threads = 1 }
container-tests = { max-threads = 8 }
ci-container-tests = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'test(container_) | test(e2e) | binary(container_e2e) | binary(static_e2e) | test(llm_) | binary(llm_e2e) | binary(llm_embedded)'
test-group = 'container-tests'

[[profile.default.overrides]]
filter = 'binary(container_buildkit)'
test-group = 'serial-tests'

[[profile.ci.overrides]]
filter = 'test(container_) | test(e2e) | binary(container_e2e) | binary(static_e2e) | test(llm_) | binary(llm_e2e) | binary(llm_embedded)'
test-group = 'ci-container-tests'

# BuildKit daemon tests share state via OnceCell — keep serial.
# Extra-long timeout: these pull moby/buildkit image + build peelbox image from scratch.
[[profile.ci.overrides]]
filter = 'binary(container_buildkit)'
test-group = 'serial-tests'
slow-timeout = { period = "600s", terminate-after = 5 }
